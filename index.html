<!DOCTYPE html>
<html>
<head>
    <title>Welcome to SR University</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
        }

        .container {
            background-color: white;
            width: 60%;
            margin: 150px auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: darkblue;
            font-size: 40px;
        }

        p {
            color: gray;
            font-size: 20px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to SR University</h1>

        <p>Empowering Students Through Education and Innovation</p>

        <button>Explore SR University</button>
    </div>

</body>
</html>
